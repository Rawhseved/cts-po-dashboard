<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTS Mobility — PO Open Billing Status</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0f1117;
  --surface: #161b27;
  --surface2: #1e2535;
  --border: #2a3349;
  --border-light: #334060;
  --text: #e2e8f0;
  --text-muted: #64748b;
  --text-dim: #94a3b8;

  --amber: #f59e0b;
  --amber-dim: #78350f;
  --amber-bg: #1c1507;
  --blue: #3b82f6;
  --blue-dim: #1e3a5f;
  --blue-bg: #050d1c;
  --violet: #8b5cf6;
  --violet-dim: #3b1f6b;
  --violet-bg: #0d0818;
  --emerald: #10b981;
  --emerald-dim: #064e3b;
  --emerald-bg: #021510;

  --red: #ef4444;
  --green: #22c55e;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* ── TOPBAR ─────────────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  gap: 16px; flex-wrap: wrap;
}
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, #1d4ed8, #7c3aed);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: white; letter-spacing: -0.5px;
  font-family: 'IBM Plex Mono', monospace;
}
.topbar-title { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
.topbar-sub { font-size: 11px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; margin-top: 1px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border-light);
  background: var(--surface2); color: var(--text-dim); font-size: 12px;
  font-weight: 500; cursor: pointer; font-family: inherit;
  transition: all .15s; white-space: nowrap;
}
.btn:hover { border-color: var(--blue); color: var(--text); background: var(--blue-dim); }
.btn-primary { background: var(--blue); border-color: var(--blue); color: white; }
.btn-primary:hover { background: #2563eb; border-color: #2563eb; }
.btn-green { background: #064e3b; border-color: var(--emerald); color: var(--emerald); }
.btn-green:hover { background: #065f46; }
.btn.active { border-color: var(--red); background: #300; color: var(--red); }

/* ── PAGE ───────────────────────────────────────────────────────────── */
.page { max-width: 1400px; margin: 0 auto; padding: 24px 28px; }

/* ── KPI TILES ──────────────────────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px; margin-bottom: 20px;
}
@media(max-width: 900px){ .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
@media(max-width: 500px){ .kpi-grid { grid-template-columns: 1fr; } }

.kpi-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 20px;
  cursor: pointer; transition: all .15s; position: relative; overflow: hidden;
  user-select: none;
}
.kpi-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: 3px 0 0 3px;
  background: var(--card-accent);
}
.kpi-card:hover { border-color: var(--card-accent); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,0,0,.3); }
.kpi-card.active { border-color: var(--card-accent); background: var(--card-bg); box-shadow: 0 0 0 1px var(--card-accent); }
.kpi-card.active .kpi-check { opacity: 1; }

.kpi-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.kpi-icon { font-size: 18px; }
.kpi-check { font-size: 12px; color: var(--card-accent); opacity: 0; transition: opacity .15s; font-weight: 700; }
.kpi-count { font-size: 32px; font-weight: 700; line-height: 1; color: white; letter-spacing: -1px; font-family: 'IBM Plex Mono', monospace; }
.kpi-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-top: 4px; }
.kpi-amount { font-size: 13px; color: var(--card-accent); font-family: 'IBM Plex Mono', monospace; margin-top: 6px; font-weight: 600; }

.kpi-card[data-key="pendingBilling"]      { --card-accent: var(--amber);   --card-bg: var(--amber-bg); }
.kpi-card[data-key="pendingReceipt"]      { --card-accent: var(--blue);    --card-bg: var(--blue-bg); }
.kpi-card[data-key="pendingBillPartReceived"] { --card-accent: var(--violet);  --card-bg: var(--violet-bg); }
.kpi-card[data-key="partiallyReceived"]   { --card-accent: var(--emerald); --card-bg: var(--emerald-bg); }

/* ── SUMMARY BANNER ─────────────────────────────────────────────────── */
.summary-bar {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 20px; margin-bottom: 20px;
}
.summary-stat { display: flex; flex-direction: column; }
.summary-stat-val { font-size: 18px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; color: white; }
.summary-stat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 1px; }
.summary-divider { width: 1px; height: 32px; background: var(--border); }

/* ── TOOLBAR ────────────────────────────────────────────────────────── */
.toolbar {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  margin-bottom: 16px;
}
.search-wrap { flex: 1; min-width: 220px; position: relative; }
.search-wrap input {
  width: 100%; padding: 9px 14px 9px 38px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-size: 13px;
  font-family: inherit; outline: none; transition: border .15s;
}
.search-wrap input:focus { border-color: var(--blue); }
.search-wrap input::placeholder { color: var(--text-muted); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none; }

.filter-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: 7px;
  font-size: 12px; color: var(--text-muted);
  background: var(--surface); border: 1px solid var(--border);
  font-size: 12px; font-weight: 500;
}
.filter-pill.active-filter { border-color: var(--red); color: var(--red); background: #1a0505; }
.filter-pill .x { cursor: pointer; opacity: .6; }
.filter-pill .x:hover { opacity: 1; }

/* ── TABLE SECTION ──────────────────────────────────────────────────── */
.section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 16px; overflow: hidden;
  display: none;
}
.section.visible { display: block; }

.section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 18px; cursor: pointer; user-select: none;
  border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px;
  transition: background .12s;
}
.section-head:hover { background: var(--surface2); }
.section-head-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.section-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700; font-family: 'IBM Plex Mono', monospace;
}
.section-total { font-size: 12px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.section-label { font-size: 14px; font-weight: 600; }
.section-chevron { font-size: 11px; color: var(--text-muted); transition: transform .2s; }
.section-chevron.closed { transform: rotate(-90deg); }

.section[data-key="pendingBilling"]           .section-badge { background: var(--amber-dim); color: var(--amber); }
.section[data-key="pendingReceipt"]           .section-badge { background: var(--blue-dim); color: var(--blue); }
.section[data-key="pendingBillPartReceived"]  .section-badge { background: var(--violet-dim); color: var(--violet); }
.section[data-key="partiallyReceived"]        .section-badge { background: var(--emerald-dim); color: var(--emerald); }

.section[data-key="pendingBilling"]           .section-label { color: var(--amber); }
.section[data-key="pendingReceipt"]           .section-label { color: var(--blue); }
.section[data-key="pendingBillPartReceived"]  .section-label { color: var(--violet); }
.section[data-key="partiallyReceived"]        .section-label { color: var(--emerald); }

.section[data-key="pendingBilling"]           .section-total { color: var(--amber); }
.section[data-key="pendingReceipt"]           .section-total { color: var(--blue); }
.section[data-key="pendingBillPartReceived"]  .section-total { color: var(--violet); }
.section[data-key="partiallyReceived"]        .section-total { color: var(--emerald); }

.table-wrap { overflow-x: auto; }
.table-wrap.hidden { display: none; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  padding: 10px 16px; text-align: left;
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-muted); background: var(--surface2);
  border-bottom: 1px solid var(--border); white-space: nowrap;
  cursor: pointer; user-select: none;
}
thead th:hover { color: var(--text); }
thead th.sorted-asc::after { content: ' ↑'; color: var(--blue); }
thead th.sorted-desc::after { content: ' ↓'; color: var(--blue); }
thead th.right { text-align: right; }

tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }

td { padding: 10px 16px; vertical-align: middle; }

.td-po a {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
  color: var(--blue); text-decoration: none;
  transition: color .12s; white-space: nowrap;
}
.td-po a:hover { color: #93c5fd; text-decoration: underline; }
.td-date { color: var(--text-dim); font-size: 12px; white-space: nowrap; font-family: 'IBM Plex Mono', monospace; }
.td-due  { white-space: nowrap; font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
.td-due.empty { color: var(--text-muted); }
.td-due.overdue { color: var(--red); font-weight: 600; }
.td-amount { text-align: right; white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
.td-amount.zero { color: var(--text-muted); }
.td-amount.nonzero { color: var(--text); font-weight: 600; }
.td-tracking { color: var(--text-muted); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.empty-row td { text-align: center; padding: 28px; color: var(--text-muted); font-style: italic; }

/* Table footer total row */
.tfoot-row td { background: var(--surface2); font-weight: 700; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--border-light); }
.tfoot-row .tfoot-total { color: var(--text); }

/* ── FOOTER ─────────────────────────────────────────────────────────── */
.page-footer { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 24px; font-family: 'IBM Plex Mono', monospace; }

/* ── SCROLLBAR ──────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #4a5568; }
</style>
</head>

  <!-- SECTIONS -->
  <div id="sections"></div>

</div>

const NS_BASE = "https://3662910.app.netsuite.com/app/accounting/transactions/purchord.nl?id=";

const STATUS_CONFIG = {
  pendingBilling:          { label:"Pending Bill",                         icon:"📄", accent:"#f59e0b" },
  pendingReceipt:          { label:"Pending Receipt",                      icon:"📦", accent:"#3b82f6" },
  pendingBillPartReceived: { label:"Pending Billing / Partially Received", icon:"🔖", accent:"#8b5cf6" },
  partiallyReceived:       { label:"Partially Received",                   icon:"📬", accent:"#10b981" }
};

// ── State ─────────────────────────────────────────────────────────────────────
let activeStatuses = new Set();
let zeroOnly       = false;
let sortState      = {};   // { key: { col, dir } }

// ── Helpers ───────────────────────────────────────────────────────────────────
const NS   = n => `https://3662910.app.netsuite.com/app/accounting/transactions/purchord.nl?id=${n}`;
const amt  = v => parseFloat(String(v||"0").replace(/,/g,"")) || 0;
const isZero = r => amt(r.amount) === 0;

function fmtMoney(n) {
  if (!n) return null;
  return "$" + n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function parseDate(str) {
  if (!str) return 0;
  const [m,d,y] = str.split("/");
  return new Date(+y, +m-1, +d).getTime();
}

function today() { return new Date("2026-05-27").getTime(); }

function isOverdue(dueDate) {
  if (!dueDate) return false;
  return parseDate(dueDate) < today();
}

// ── Filtering & Sorting ───────────────────────────────────────────────────────
function getFiltered(key) {
  const q = document.getElementById("search").value.toLowerCase().trim();
  let rows = DATA[key];
  if (zeroOnly) rows = rows.filter(isZero);
  if (q) rows = rows.filter(r =>
    r.po.toLowerCase().includes(q) ||
    r.date.toLowerCase().includes(q) ||
    (r.dueDate||"").toLowerCase().includes(q) ||
    (r.trackingInfo||"").toLowerCase().includes(q)
  );
  // Sort
  const s = sortState[key];
  if (s) {
    rows = [...rows].sort((a,b) => {
      let av, bv;
      if (s.col==="amount") { av=amt(a.amount); bv=amt(b.amount); }
      else if (s.col==="date")    { av=parseDate(a.date);    bv=parseDate(b.date); }
      else if (s.col==="dueDate") { av=parseDate(a.dueDate); bv=parseDate(b.dueDate); }
      else { av=(a[s.col]||"").toLowerCase(); bv=(b[s.col]||"").toLowerCase(); }
      return s.dir==="asc" ? (av>bv?1:-1) : (av<bv?1:-1);
    });
  }
  return rows;
}

// ── Build KPI Tiles ───────────────────────────────────────────────────────────
function buildKPI() {
  const grid = document.getElementById("kpi-grid");
  Object.entries(STATUS_CONFIG).forEach(([key, cfg]) => {
    const count = DATA[key].length;
    const total = DATA[key].reduce((s,r)=>s+amt(r.amount),0);
    const card = document.createElement("div");
    card.className = "kpi-card"; card.id = "kpi-"+key; card.dataset.key = key;
    card.onclick = () => toggleStatus(key);
    card.innerHTML = `
      <div class="kpi-header">
        <span class="kpi-icon">${cfg.icon}</span>
        <span class="kpi-check">✓ ACTIVE</span>
      </div>
      <div class="kpi-count">${count}</div>
      <div class="kpi-label">${cfg.label}</div>
      <div class="kpi-amount">${fmtMoney(total)}</div>`;
    grid.appendChild(card);
  });
}

// ── Build Summary Bar ─────────────────────────────────────────────────────────
function updateSummaryBar() {
  const el = document.getElementById("summary-bar");
  const keys = activeStatuses.size ? [...activeStatuses] : Object.keys(STATUS_CONFIG);
  let totalCount=0, totalAmt=0, zeroCount=0;
  keys.forEach(k => {
    const filtered = getFiltered(k);
    totalCount += filtered.length;
    totalAmt   += filtered.reduce((s,r)=>s+amt(r.amount),0);
    zeroCount  += filtered.filter(isZero).length;
  });
  el.innerHTML = `
    <div class="summary-stat"><div class="summary-stat-val">${totalCount}</div><div class="summary-stat-lbl">Visible POs</div></div>
    <div class="summary-divider"></div>
    <div class="summary-stat"><div class="summary-stat-val">${fmtMoney(totalAmt)||"$0.00"}</div><div class="summary-stat-lbl">Total Exposure</div></div>
    <div class="summary-divider"></div>
    <div class="summary-stat"><div class="summary-stat-val">${zeroCount}</div><div class="summary-stat-lbl">Zero / Blank Amount</div></div>
    <div class="summary-divider"></div>
    <div class="summary-stat"><div class="summary-stat-val">${totalCount - zeroCount}</div><div class="summary-stat-lbl">With Amount</div></div>`;
}

// ── Build Sections ────────────────────────────────────────────────────────────
function buildSections() {
  const container = document.getElementById("sections");
  Object.entries(STATUS_CONFIG).forEach(([key, cfg]) => {
    const sec = document.createElement("div");
    sec.className = "section visible"; sec.id = "sec-"+key; sec.dataset.key = key;

function buildTableHeader(key, cfg) {
  const thead = document.getElementById("thead-"+key);
  const cols = [
    {id:"po",           label:"PO Number",       cls:""},
    {id:"date",         label:"PO Date",         cls:""},
    {id:"dueDate",      label:"Due / Receive By", cls:""},
    {id:"amount",       label:"Amount",          cls:"right"},
    {id:"trackingInfo", label:"Tracking Info",   cls:""},
  ];
  const tr = document.createElement("tr");
  cols.forEach(c => {
    const th = document.createElement("th");
    th.className = c.cls; th.dataset.col = c.id; th.dataset.key = key;
    th.textContent = c.label;
    th.onclick = () => sortBy(key, c.id);
    tr.appendChild(th);
  });
  thead.appendChild(tr);
}

// ── Render Table Rows ─────────────────────────────────────────────────────────
function renderRows(key) {
  const rows = getFiltered(key);
  const tbody = document.getElementById("tbody-"+key);
  const tfoot = document.getElementById("tfoot-"+key);
  tbody.innerHTML = "";
  tfoot.innerHTML = "";

  // Update badge + total
  const total = rows.reduce((s,r)=>s+amt(r.amount),0);
  document.getElementById("badge-"+key).textContent = `${rows.length} / ${DATA[key].length}`;
  document.getElementById("stotal-"+key).textContent = fmtMoney(total) || "$0.00";

  if (!rows.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="5">No results match current filters</td></tr>`;
    return;
  }

  rows.forEach(r => {
    const a = amt(r.amount);
    const link = r.id ? NS(r.id) : "#";
    const dueClass = isOverdue(r.dueDate) ? "overdue" : (r.dueDate ? "" : "empty");
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="td-po"><a href="${link}" target="_blank" rel="noopener">${r.po}</a></td>
      <td class="td-date">${r.date}</td>
      <td class="td-due ${dueClass}">${r.dueDate || "—"}</td>
      <td class="td-amount ${a ? "nonzero" : "zero"}">${fmtMoney(a) || "—"}</td>
      <td class="td-tracking" title="${(r.trackingInfo||"").replace(/"/g,"&quot;")}">${r.trackingInfo || "—"}</td>`;
    tbody.appendChild(tr);
  });

  // Footer total row
  const footTr = document.createElement("tr");
  footTr.className = "tfoot-row";
  footTr.innerHTML = `
    <td colspan="3" style="padding-left:16px;letter-spacing:.06em;font-size:10px">SUBTOTAL — ${rows.length} PO${rows.length!==1?"s":""}</td>
    <td class="td-amount tfoot-total" style="text-align:right">${fmtMoney(total)||"—"}</td>
    <td></td>`;
  tfoot.appendChild(footTr);

  // Update sort indicators
  const s = sortState[key];
  document.querySelectorAll(`#thead-${key} th`).forEach(th => {
    th.classList.remove("sorted-asc","sorted-desc");
    if (s && th.dataset.col === s.col) th.classList.add(s.dir==="asc"?"sorted-asc":"sorted-desc");
  });
}

// ── Sort ──────────────────────────────────────────────────────────────────────
function sortBy(key, col) {
  const cur = sortState[key];
  if (cur && cur.col === col) {
    sortState[key] = { col, dir: cur.dir==="asc" ? "desc" : "asc" };
  } else {
    sortState[key] = { col, dir: "asc" };
  }
  renderRows(key);
}

// ── Section Toggle ────────────────────────────────────────────────────────────
function toggleSection(key) {
  const wrap = document.getElementById("twrap-"+key);
  const chv  = document.getElementById("chv-"+key);
  wrap.classList.toggle("hidden");
  chv.classList.toggle("closed");
}

// ── Status Filter ─────────────────────────────────────────────────────────────
function toggleStatus(key) {
  activeStatuses.has(key) ? activeStatuses.delete(key) : activeStatuses.add(key);
  document.getElementById("kpi-"+key).classList.toggle("active", activeStatuses.has(key));
  applyFilters();
}

// ── Zero Toggle ───────────────────────────────────────────────────────────────
function toggleZero() {
  zeroOnly = !zeroOnly;
  const btn = document.getElementById("btn-zero");
  btn.classList.toggle("active", zeroOnly);
  document.getElementById("btn-zero-label").textContent = zeroOnly ? "Zero Only ✓" : "Zero Amounts";
  applyFilters();
}

// ── Clear All ─────────────────────────────────────────────────────────────────
function clearAll() {
  activeStatuses.clear();
  zeroOnly = false;
  document.getElementById("search").value = "";
  document.getElementById("btn-zero").classList.remove("active");
  document.getElementById("btn-zero-label").textContent = "Zero Amounts";
  document.querySelectorAll(".kpi-card").forEach(c => c.classList.remove("active"));
  applyFilters();
}

// ── Main Apply ────────────────────────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById("search").value.trim();
  const hasStatus = activeStatuses.size > 0;

  Object.keys(STATUS_CONFIG).forEach(key => {
    const sec = document.getElementById("sec-"+key);
    if (hasStatus && !activeStatuses.has(key)) { sec.classList.remove("visible"); return; }
    sec.classList.add("visible");
    renderRows(key);
  });

  updateSummaryBar();

  // Filter info pill
  const parts = [];
  if (activeStatuses.size) parts.push([...activeStatuses].map(k=>STATUS_CONFIG[k].label).join(", "));
  if (zeroOnly) parts.push("Zero / blank amount");
  if (q) parts.push(`"${q}"`);
  const info = document.getElementById("filter-info");
  document.getElementById("filter-info-text").textContent = parts.length ? "Filters: " + parts.join(" · ") : "";
  info.style.display = parts.length ? "flex" : "none";
  info.className = "filter-pill active-filter";

  document.getElementById("btn-clear").style.display = (hasStatus||zeroOnly||q) ? "inline-flex" : "none";

  // Footer timestamp
  document.getElementById("page-footer").textContent =
    `CTS Mobility · PO Open Billing Status · Data: May 27, 2026 · Saved Search #5528 · ${Object.values(DATA).flat().length} total POs`;
}

// ── Excel Export ──────────────────────────────────────────────────────────────
function exportExcel() {
  const wb = XLSX.utils.book_new();
  const HDRS = ["PO Number","PO Date","Due / Receive By","Amount ($)","Billing Status","Tracking Info"];
  const keys = activeStatuses.size ? [...activeStatuses] : Object.keys(STATUS_CONFIG);

  // Summary sheet
  let grandCount=0, grandAmt=0;
  const sumRows = [["CTS Mobility — PO Open Billing Status"],
    [`Exported ${new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}`],[],["Status","PO Count","Total Amount ($)"]];
  keys.forEach(k => {
    const f = getFiltered(k); const t = f.reduce((s,r)=>s+amt(r.amount),0);
    grandCount+=f.length; grandAmt+=t;
    sumRows.push([STATUS_CONFIG[k].label, f.length, t]);
  });
  sumRows.push(["GRAND TOTAL", grandCount, grandAmt]);
  const ws0 = XLSX.utils.aoa_to_sheet(sumRows);
  ws0["!cols"] = [{wch:42},{wch:12},{wch:18}];
  XLSX.utils.book_append_sheet(wb, ws0, "Summary");

  // Per-status sheets
  keys.forEach(k => {
    const rows = [HDRS, ...getFiltered(k).map(r=>[r.po,r.date,r.dueDate||"",amt(r.amount)||"",STATUS_CONFIG[k].label,r.trackingInfo||""])];
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{wch:16},{wch:12},{wch:14},{wch:16},{wch:34},{wch:55}];
    ws["!autofilter"] = { ref:`A1:F${rows.length}` };
    XLSX.utils.book_append_sheet(wb, ws, STATUS_CONFIG[k].label.replace(/\//g,"-").substring(0,31));
  });

  // All POs sheet
  const allRows = [HDRS, ...keys.flatMap(k=>getFiltered(k).map(r=>[r.po,r.date,r.dueDate||"",amt(r.amount)||"",STATUS_CONFIG[k].label,r.trackingInfo||""]))];
  const wsAll = XLSX.utils.aoa_to_sheet(allRows);
  wsAll["!cols"] = [{wch:16},{wch:12},{wch:14},{wch:16},{wch:34},{wch:55}];
  wsAll["!autofilter"] = { ref:`A1:F${allRows.length}` };
  XLSX.utils.book_append_sheet(wb, wsAll, "All POs");

  const suffix = (activeStatuses.size||zeroOnly||document.getElementById("search").value.trim()) ? "_filtered" : "";
  XLSX.writeFile(wb, `CTS_PO_Open_Billing${suffix}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  const zeroCount = Object.values(DATA).flat().filter(isZero).length;
  document.getElementById("btn-zero-count").textContent = zeroCount;
  buildKPI();
  buildSections();
  applyFilters();
})();
</script>
</body>
</html>
